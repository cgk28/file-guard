<button class="pill" id="tg">🌙 Tối</button><div class="pill mono" id="clock">--:--:--</div><div class="pill"><i></i>LIVE</div>
</header>
<main>
<div id="kpi">
<div class="card k" style="--c:#4a6283;--c2:#7f9bb8"><div class="ic">⚡</div><div><label>Tool calls</label><b id="k1">0</b></div></div>
<div class="card k" style="--c:#a8384a;--c2:#d1707c"><div class="ic">⛔</div><div><label>Đã chặn</label><b id="k2">0</b></div></div>
<div class="card k" style="--c:#3f6e6a;--c2:#7fa89a"><div class="ic">🔍</div><div><label>Scans</label><b id="k3">0</b><em id="k3s">—</em></div></div>
<div class="card k" style="--c:#7a4a5c;--c2:#b0808f"><div class="ic">🔑</div><div><label>Secrets</label><b id="k4">0</b></div></div>
<div class="card k" style="--c:#b5532f;--c2:#d9985a"><div class="ic">⚑</div><div><label>Flagged</label><b id="k5">0</b></div></div>
</div>
<div id="mid">
<div class="card box"><h3>Tỉ lệ</h3><div class="donut"><svg viewBox="0 0 36 36" id="dn"></svg><div><div class="c" id="pct">–</div><small>an toàn</small></div></div></div>
<div class="card box"><h3><span>Nhịp hoạt động</span><span id="rng" class="mono"></span></h3><div id="strip"></div><div class="lg" style="margin-top:10px;display:flex;gap:14px"><span><i style="background:var(--gr)"></i>ok</span><span><i style="background:var(--am)"></i>chạy</span><span><i style="background:var(--rd)"></i>chặn/lỗi</span></div></div>
<div class="card box"><h3><span>Tool dùng nhiều</span><span class="chips" id="chips"></span></h3><div id="top"></div></div>
</div>
<section class="card feed">
<div class="fh"><h2>Live feed</h2><div class="tabs"><button class="tab a" data-f="all">Tất cả</button><button class="tab" data-f="blk">Bị chặn</button><button class="tab" data-f="err">Lỗi</button></div><div id="mini"></div><div class="sp"></div><input id="q" placeholder="Tìm tool, lệnh…"></div>
<div id="log"></div></section>
</main>
<script>
const $=id=>document.getElementById(id),log=$('log');let prev='',F='all',Q='',last={lines:[],blocked:0};
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{F=t.dataset.f;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('a',x===t));prev='';draw(last)});
$('q').oninput=e=>{Q=e.target.value.toLowerCase();prev='';draw(last)};
setInterval(()=>$('clock').textContent=new Date().toLocaleTimeString('vi-VN'),1000);
const col=s=>s==='ok'?'var(--gr)':s==='run'?'var(--am)':'var(--rd)';
function draw(d){last=d;const s=F+Q+JSON.stringify(d);if(s===prev)return;prev=s;const A=d.lines;
 $('k1').textContent=A.length;$('k2').textContent=d.blocked;
 const n=k=>A.filter(x=>x.st===k).length,ok=n('ok'),bad=n('blk')+n('err'),run=n('run'),tot=A.length||1;
 $('pct').textContent=A.length?Math.round(ok*100/tot)+'%':'–';
 let off=0;$('dn').innerHTML='<circle cx="18" cy="18" r="14" fill="none" style="stroke:var(--bar)" stroke-width="5"/>'+[[ok,'var(--gr)'],[run,'var(--am)'],[bad,'var(--rd)']].map(([v,c])=>{const l=v*88/tot,e='<circle cx="18" cy="18" r="14" fill="none" style="stroke:'+c+'" stroke-width="5" stroke-linecap="round" stroke-dasharray="'+Math.max(l-1,0)+' 88" stroke-dashoffset="'+(-off)+'"/>';off+=l;return v?e:''}).join('');
 $('strip').innerHTML=A.slice(-48).map(x=>'<s style="--c:'+col(x.st)+';height:'+(x.ms!=null?Math.min(100,18+Math.log10(x.ms+1)*20):40)+'%" title="'+esc(x.tool)+'"></s>').join('');
 $('rng').textContent=A.length?(A[0].at||'')+' → '+(A[A.length-1].at||''):'';
 const c={};A.forEach(x=>c[x.tool]=(c[x.tool]||0)+1);const T=Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,5),mx=T[0]?T[0][1]:1;
 $('top').innerHTML=T.map(([k,v])=>'<div class="t"><span>'+esc(k)+'</span><div class="bar"><u style="width:'+v*100/mx+'%"></u></div><b>'+v+'</b></div>').join('');
 const L=A.filter(x=>(F==='all'||x.st===F)&&(!Q||((x.tool||'')+' '+(x.arg||'')).toLowerCase().includes(Q)));
 const mxm=Math.max(1,...A.map(x=>x.ms||0));
 log.innerHTML=L.length?L.map(x=>{const st=x.st||'';const b=st==='run'?'<span class="b run">⟳ đang chạy</span>':st==='ok'?'<span class="b ok">✔ OK</span>':st==='err'?'<span class="b err">✘ Lỗi</span>':st==='blk'?'<span class="b blk">⛔ Chặn</span>':'<span></span>';
  return '<div class="r st-'+st+(x.skill?' skill':'')+'"><span class="ts">'+esc(x.at||'')+'</span><span class="ti">'+(x.skill?'◆':'$')+'</span><span class="nm">'+esc(x.tool)+'</span><span class="ar" title="'+esc(x.arg||'')+'">'+esc(x.arg||'')+(x.why?' <span class="why">— '+esc(x.why)+'</span>':'')+'</span>'+b+'<span class="dur"><u style="width:'+(x.ms?Math.max(4,Math.min(100,Math.log10(x.ms+1)/Math.log10(mxm+1)*100)):0)+'%"></u></span><span class="ms">'+(x.ms!=null?x.ms+' ms':'')+'</span></div>'}).join(''):'<div class="empty">Chưa có gì ở mục này ✨</div>';
 log.scrollTop=log.scrollHeight}
async function tick(){try{draw(await (await fetch('/feed')).json())}catch{}}
window.__st='';async function st(){try{const o=await (await fetch('/status')).json();window.__st='<span title="Chế độ bảo vệ">🛡 <b>'+o.mode+'</b></span>'+(o.attacks?'<span title="Red-team: tấn công bị chặn / lệnh lành qua">🎯 <b>'+o.attacks+'</b> · <b>'+o.benign+'</b></span>':'')+'<span title="Nhật ký 24h: bị chặn / file quét sạch">📜 <b>'+o.denied+'</b>/<b>'+o.scannedOk+'</b></span>'}catch{}}
async function sc(){try{const o=await (await fetch('/scanners')).json();
 $('k3').textContent=o.scans;$('k4').textContent=o.findings;$('k5').textContent=o.flagged;$('k3s').textContent=o.last?(o.last.target+' → '+o.last.verdict):'chưa có';
 const c=(n,v)=>'<span class="chip '+(v?'on':'off')+'"><s></s>'+n+'</span>';$('chips').innerHTML=c(o.secretsTool||'trufflehog',o.secretsOk)+c('strings',o.strings)}catch{}}
function mini(){const g=i=>$(i).textContent,ch=[...$('chips').children].map(c=>'<span class="'+(c.classList.contains('on')?'on':'off')+'">● '+c.textContent+'</span>').join('');
 $('mini').innerHTML='<span title="Tool calls">⚡ <b>'+g('k1')+'</b></span><span title="Đã chặn">⛔ <b>'+g('k2')+'</b></span><span title="Scans">🔍 <b>'+g('k3')+'</b></span><span title="Secrets">🔑 <b>'+g('k4')+'</b></span><span title="Flagged">⚑ <b>'+g('k5')+'</b></span>'+ch+window.__st}
setInterval(mini,700);
tick();sc();st();setInterval(st,5000);setInterval(tick,700);setInterval(sc,5000);
const H=document.documentElement,tg=document.getElementById('tg');
function setT(t){H.dataset.t=t;localStorage.tmT=t;tg.textContent=t==='dark'?'☀️ Sáng':'🌙 Tối'}
tg.onclick=()=>setT(H.dataset.t==='dark'?'light':'dark');
setT(localStorage.tmT||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'));
</script>
